<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space details &middot; Nest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html">🌿 Nest</a>
      <nav class="nav">
        <a href="index.html">Spaces</a>
        <span id="nav-guest-links">
          <a href="login.html">Log in</a>
          <a class="btn btn--primary btn--small" href="register.html">Sign up</a>
        </span>
        <span id="nav-user-links" hidden>
          <a href="my-bookings.html">My Bookings</a>
          <span id="nav-username" class="nav__greeting"></span>
          <a href="#" id="nav-logout">Log out</a>
        </span>
      </nav>
    </div>
  </header>

  <main class="container">
    <a class="back-link" href="index.html">&larr; Back to all spaces</a>

    <div class="space-detail" id="space-detail">
      <p class="empty-state">Loading space…</p>
    </div>

    <section class="booking-panel">
      <h2>Book this space</h2>

      <p id="booking-login-prompt" class="empty-state" hidden>
        <a href="login.html">Log in</a> to reserve this space.
      </p>

      <form id="booking-form" class="booking-form">
        <label>
          Date
          <input type="date" name="date" id="booking-date" required />
        </label>
        <label>
          Start time
          <input type="time" name="start_time" required />
        </label>
        <label>
          End time
          <input type="time" name="end_time" required />
        </label>
        <button type="submit" class="btn btn--primary">Confirm booking</button>
      </form>
    </section>
  </main>

  <script type="module" src="js/pages/space.js"></script>
</body>
</html>
