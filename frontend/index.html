<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nest &middot; Coworking Spaces</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html">🌿 Nest</a>
      <nav class="nav">
        <a href="index.html">Spaces</a>
        <span id="nav-guest-links">
          <a href="login.html">Log in</a>
          <a class="btn btn--primary btn--small" href="register.html">Sign up</a>
        </span>
        <span id="nav-user-links" hidden>
          <a href="my-bookings.html">My Bookings</a>
          <span id="nav-username" class="nav__greeting"></span>
          <a href="#" id="nav-logout">Log out</a>
        </span>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1>Find a calm place to do your best work.</h1>
        <p>Browse sunlit desks, private rooms, and quiet corners — book by the hour, no commitment.</p>
      </div>
    </section>

    <section class="container">
      <form id="filter-form" class="filter-bar">
        <input type="search" name="search" placeholder="Search by name or description…" aria-label="Search spaces" />
        <select name="capacity" aria-label="Minimum capacity">
          <option value="">Any capacity</option>
          <option value="1">1+ people</option>
          <option value="2">2+ people</option>
          <option value="4">4+ people</option>
          <option value="8">8+ people</option>
        </select>
        <button type="submit" class="btn btn--secondary">Filter</button>
      </form>

      <div id="space-grid" class="space-grid"></div>
    </section>
  </main>

  <script type="module" src="js/pages/home.js"></script>
</body>
</html>
