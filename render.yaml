# Render blueprint — creates the API service and its Postgres database.
# In Render: New → Blueprint → connect this repo. Render reads this file and
# prompts for the values marked `sync: false`.
services:
  - type: web
    name: coworking-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /api/spaces/
    envVars:
      - key: SECRET_KEY
        generateValue: true          # Render generates a strong key
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: coworking-db
          property: connectionString
      # Leave CORS open so any site can call the API from the browser.
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: TIME_ZONE
        value: Africa/Cairo
      # Prompted on deploy — never stored in the repo.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: coworking-db
    plan: free
